<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Prompt Archive</title>
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --line: #e3e3de; --text: #1d1d1b; --muted: #6b6b66;
  --accent: #2f5bd3; --on-accent: #ffffff; --accent-soft: #e8eefc; --ok: #1f7a4d; --bad: #b3261e; --warn: #9a6700;
  --user: #f1f4fb; --assistant: #f6f6f3; --system: #fbf6ea; --tool: #f3f8f4; --code: #f2f2ee;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #131312; --panel: #1b1b1a; --line: #2e2e2b; --text: #e9e9e4; --muted: #9a9a93;
    --accent: #8aa8ff; --on-accent: #0d1426; --accent-soft: #232b40; --ok: #5cc28f; --bad: #ff8a80; --warn: #e3b341;
    --user: #1d2230; --assistant: #20201e; --system: #26231a; --tool: #1b251f; --code: #232321;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 2; }
header h1 { font-size: 15px; margin: 0; font-weight: 650; }
#stats { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
header .spacer { flex: 1; }
button, input, select { font: inherit; color: inherit; }
button { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
input, select { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; min-width: 0; }
input:focus, select:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
form#filters { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
form#filters .wide { grid-column: span 2; }
form#filters label.check { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
main { display: grid; grid-template-columns: minmax(340px, 44%) 1fr; height: calc(100vh - var(--top, 120px)); }
#list { overflow: auto; border-right: 1px solid var(--line); }
#detail { overflow: auto; padding: 14px 18px 40px; }
.row { padding: 9px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
.row:hover { background: var(--accent-soft); }
.row.sel { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.row .top { display: flex; gap: 8px; align-items: baseline; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .top .model { color: var(--text); font-weight: 600; }
.row .top .grow { flex: 1; }
.row .pv { margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .pv.empty { color: var(--muted); font-style: italic; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); margin-right: 2px; }
.dot.bad { background: var(--bad); } .dot.warn { background: var(--warn); }
#more { display: block; margin: 12px auto; }
.empty-state { color: var(--muted); padding: 30px 16px; text-align: center; }
.meta { display: grid; grid-template-columns: max-content 1fr; gap: 3px 12px; font-size: 12.5px; margin: 0 0 14px; }
.meta dt { color: var(--muted); }
.meta dd { margin: 0; overflow-wrap: anywhere; }
.chip { cursor: pointer; border-bottom: 1px dashed var(--muted); }
.chip:hover { color: var(--accent); border-color: var(--accent); }
.tabs { display: flex; gap: 6px; margin: 6px 0 12px; flex-wrap: wrap; }
.tabs button.on { background: var(--accent-soft); border-color: var(--accent); }
.msg { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 10px; overflow: hidden; }
.msg > .role { font-size: 11.5px; font-weight: 650; text-transform: uppercase; letter-spacing: .04em; padding: 5px 10px; color: var(--muted); border-bottom: 1px solid var(--line); }
.msg.user { background: var(--user); } .msg.assistant { background: var(--assistant); }
.msg.system, .msg.developer { background: var(--system); } .msg.tool { background: var(--tool); }
.msg.reply { outline: 2px solid var(--accent); outline-offset: -2px; }
.part { padding: 8px 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
.part + .part { border-top: 1px dashed var(--line); }
.part .tag { font-size: 11px; color: var(--muted); font-family: var(--mono); margin-bottom: 3px; white-space: normal; }
.part.code, .part .code { font-family: var(--mono); font-size: 12.5px; }
details > summary { cursor: pointer; color: var(--muted); font-size: 12.5px; }
pre.json { background: var(--code); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font: 12px/1.45 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
mark { background: #ffe58a; color: #1d1d1b; border-radius: 2px; }
#keyDialog { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--text); padding: 18px; width: min(420px, calc(100vw - 32px)); }
#keyDialog::backdrop { background: rgba(0,0,0,.35); }
#keyDialog p { color: var(--muted); margin: 0 0 12px; font-size: 13px; }
#keyDialog input { width: 100%; margin-bottom: 12px; }
.err { color: var(--bad); padding: 12px 16px; }
@media (max-width: 820px) {
  main { grid-template-columns: 1fr; height: auto; }
  #list { max-height: 55vh; border-right: 0; border-bottom: 1px solid var(--line); }
  form#filters .wide { grid-column: span 1; }
}
</style>
</head>
<body>
<header>
  <h1>Prompt Archive</h1>
  <span id="stats"></span>
  <span class="spacer"></span>
  <button id="changeKey" type="button">Management key</button>
</header>
<form id="filters" autocomplete="off">
  <input class="wide" name="q" placeholder="Search previews, models, sessions…">
  <label class="check"><input type="checkbox" name="deep"> Search full text</label>
  <select name="since">
    <option value="">Any time</option><option value="1h">Last hour</option><option value="24h">Last 24 hours</option>
    <option value="7d">Last 7 days</option><option value="30d">Last 30 days</option>
  </select>
  <input name="model" placeholder="Model">
  <input name="key" placeholder="Client key">
  <input name="auth" placeholder="Credential">
  <input name="session" placeholder="Session">
  <input name="client" placeholder="Client (UA or IP)">
  <select name="protocol">
    <option value="">Any protocol</option><option>openai</option><option>openai-response</option><option>claude</option><option>gemini</option>
  </select>
  <select name="status"><option value="">Any status</option><option value="ok">OK</option><option value="error">Errors</option></select>
  <label class="check"><input type="checkbox" name="internal"> Include internal</label>
  <button class="primary" type="submit">Filter</button>
</form>
<main>
  <section id="list"></section>
  <section id="detail"><div class="empty-state">Select a prompt to see the conversation.</div></section>
</main>
<dialog id="keyDialog">
  <form method="dialog" id="keyForm">
    <p>Enter the management key (remote-management secret or MANAGEMENT_PASSWORD). It stays in this browser.</p>
    <input id="keyInput" type="password" autocomplete="current-password" placeholder="Management key">
    <button class="primary" type="submit">Save</button>
  </form>
</dialog>
<script>
(() => {
  const API = "/v8/management/observability/prompts";
  const $ = (sel) => document.querySelector(sel);
  const form = $("#filters"), list = $("#list"), detail = $("#detail");
  let key = "", next = "", selected = "", loading = false;

  try { key = localStorage.getItem("cpa-prompt-archive-key") || ""; } catch (e) {}

  function el(tag, attrs, ...children) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (k === "class") node.className = v;
      else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
      else node.setAttribute(k, v);
    }
    for (const c of children) if (c != null) node.append(c);
    return node;
  }
  const fmtBytes = (n) => n >= 1 << 30 ? (n / (1 << 30)).toFixed(2) + " GB" : n >= 1 << 20 ? (n / (1 << 20)).toFixed(1) + " MB" : n >= 1024 ? (n / 1024).toFixed(1) + " KB" : n + " B";
  const fmtNum = (n) => n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? (n / 1e3).toFixed(1) + "k" : String(n);
  const fmtTime = (t) => new Date(t).toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit", second: "2-digit" });

  async function api(path) {
    const res = await fetch(path, { headers: { "Authorization": "Bearer " + key } });
    if (res.status === 401 || res.status === 403) { askKey(); throw new Error("Management key rejected"); }
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error || res.statusText);
    return body;
  }

  function askKey() {
    $("#keyInput").value = key;
    if (!$("#keyDialog").open) $("#keyDialog").showModal();
  }
  $("#keyForm").addEventListener("submit", () => {
    key = $("#keyInput").value.trim();
    try { localStorage.setItem("cpa-prompt-archive-key", key); } catch (e) {}
    refresh();
  });
  $("#changeKey").addEventListener("click", askKey);

  function params() {
    const p = new URLSearchParams();
    for (const [k, v] of new FormData(form)) if (v) p.set(k, v === "on" ? "true" : v);
    return p;
  }
  function syncHash() {
    const p = params();
    if (selected) p.set("id", selected);
    history.replaceState(null, "", "#" + p.toString());
  }
  function loadHash() {
    const p = new URLSearchParams(location.hash.slice(1));
    for (const field of form.elements) {
      if (!field.name) continue;
      if (field.type === "checkbox") field.checked = p.get(field.name) === "true";
      else field.value = p.get(field.name) || "";
    }
    selected = p.get("id") || "";
  }

  async function loadStats() {
    try {
      const s = await api(API + "/stats");
      $("#stats").textContent = `${fmtNum(s.records)} prompts · ${fmtBytes(s.raw_bytes)} → ${fmtBytes(s.disk_bytes)} on disk (${(s.ratio || 0).toFixed(1)}×)` + (s.dropped ? ` · ${s.dropped} dropped` : "");
    } catch (e) { $("#stats").textContent = ""; }
  }

  function row(item) {
    const bad = item.outcome && item.outcome !== "ok";
    const dot = el("span", { class: "dot" + (bad ? (item.outcome === "canceled" ? " warn" : " bad") : ""), title: item.outcome || "" });
    const tokens = item.input_tokens || item.output_tokens ? `${fmtNum(item.input_tokens || 0)}→${fmtNum(item.output_tokens || 0)}` : "";
    const client = (item.user_agent || "").split(/[\s/(]/)[0];
    const r = el("div", { class: "row" + (item.id === selected ? " sel" : ""), "data-id": item.id },
      el("div", { class: "top" }, dot, el("span", { class: "model" }, item.model || "?"), el("span", {}, item.key || ""),
        el("span", {}, client), el("span", { class: "grow" }), el("span", {}, tokens), el("span", {}, fmtTime(item.time))),
      el("div", { class: "pv" + (item.preview ? "" : " empty") }, item.preview || (item.error ? "Error: " + item.error : "(no user text)")));
    r.addEventListener("click", () => select(item.id));
    return r;
  }

  async function loadPage(reset) {
    if (loading) return;
    loading = true;
    const p = params();
    if (!reset && next) p.set("before", next);
    p.set("limit", "100");
    try {
      const page = await api(API + "?" + p.toString());
      if (reset) list.replaceChildren();
      $("#more")?.remove();
      for (const item of page.items) list.append(row(item));
      next = page.next || "";
      if (!list.querySelector(".row")) list.append(el("div", { class: "empty-state" }, "No prompts match these filters."));
      if (next && page.items.length) list.append(el("button", { id: "more", type: "button", onclick: () => loadPage(false) }, page.truncated ? "Keep searching" : "Load more"));
    } catch (e) {
      if (reset) list.replaceChildren(el("div", { class: "err" }, e.message));
    } finally { loading = false; }
  }

  function refresh() {
    next = "";
    syncHash();
    loadStats();
    loadPage(true);
    if (selected) select(selected);
  }

  function highlight(text) {
    const q = (form.elements.q.value || "").trim();
    if (!q || text.length > 200000) return document.createTextNode(text);
    const frag = document.createDocumentFragment();
    const lower = text.toLowerCase(), needle = q.toLowerCase();
    let i = 0, j;
    while ((j = lower.indexOf(needle, i)) !== -1) {
      frag.append(text.slice(i, j), el("mark", {}, text.slice(j, j + q.length)));
      i = j + q.length;
    }
    frag.append(text.slice(i));
    return frag;
  }

  function prettyJSON(text) {
    try { return JSON.stringify(JSON.parse(text), null, 2); } catch (e) { return text; }
  }

  function renderPart(part) {
    const text = part.text || "";
    const label = part.type + (part.name ? " · " + part.name : "");
    if (part.type === "text") return el("div", { class: "part" }, highlight(text));
    if (part.type === "image") return el("div", { class: "part" }, el("div", { class: "tag" }, "image"));
    const body = part.type === "tool_call" ? prettyJSON(text) : text;
    const long = body.length > 400 || part.type === "thinking";
    const content = el("div", { class: "code" }, highlight(body));
    if (!long) return el("div", { class: "part code" }, el("div", { class: "tag" }, label), content);
    return el("div", { class: "part" }, el("details", {}, el("summary", {}, `${label} (${fmtNum(body.length)} chars)`), content));
  }

  function renderMessage(msg, extra) {
    const wrap = el("div", { class: "msg " + msg.role + (extra ? " " + extra : "") }, el("div", { class: "role" }, extra ? "reply" : msg.role));
    const parts = msg.parts || [];
    if (msg.role === "system" && parts.reduce((n, p) => n + (p.text || "").length, 0) > 600) {
      const body = el("div", {});
      for (const p of parts) body.append(renderPart(p));
      wrap.append(el("div", { class: "part" }, el("details", {}, el("summary", {}, "System prompt"), body)));
      return wrap;
    }
    for (const p of parts) wrap.append(renderPart(p));
    return wrap;
  }

  function chip(name, value) {
    if (!value) return "";
    return el("span", { class: "chip", title: "Filter by " + name, onclick: () => { form.elements[name].value = value; refresh(); } }, value);
  }

  async function select(id) {
    selected = id;
    syncHash();
    for (const r of list.querySelectorAll(".row")) r.classList.toggle("sel", r.dataset.id === id);
    detail.replaceChildren(el("div", { class: "empty-state" }, "Loading…"));
    let d;
    try { d = await api(API + "/" + encodeURIComponent(id)); }
    catch (e) { detail.replaceChildren(el("div", { class: "err" }, e.message)); return; }
    if (selected !== id) return;
    const meta = el("dl", { class: "meta" });
    const add = (k, v) => { if (v !== "" && v != null) meta.append(el("dt", {}, k), el("dd", {}, v)); };
    add("ID", d.id);
    add("Time", new Date(d.time).toLocaleString() + (d.duration_ms ? ` · ${(d.duration_ms / 1000).toFixed(1)}s` : ""));
    add("Model", chip("model", d.model));
    if (d.requested_model) add("Requested", d.requested_model);
    add("Protocol", `${d.protocol || "?"}${d.stream ? " · stream" : ""} · ${d.endpoint || ""}`);
    add("Status", `${d.outcome || "?"}${d.status ? " " + d.status : ""}${d.error ? " · " + d.error : ""}`);
    add("Tokens", d.input_tokens || d.output_tokens ? `${d.input_tokens || 0} in · ${d.output_tokens || 0} out` : "");
    add("Client key", chip("key", d.key));
    add("Credential", chip("auth", d.auth));
    add("Session", chip("session", d.session));
    add("Client", [d.user_agent, d.client_ip].filter(Boolean).join(" · "));
    add("Size", `${fmtBytes(d.request_bytes)} request · ${fmtBytes(d.response_bytes)} reply`);

    const views = {
      conversation: () => {
        const box = el("div", {});
        const convo = d.conversation || [];
        // Agent sessions resend the whole history; start near the latest turn.
        const keepTail = 8;
        let start = 0;
        if (convo.length > keepTail + 4) {
          start = convo.length - keepTail;
          if (convo[0].role === "system") box.append(renderMessage(convo[0]));
          const hidden = start - (convo[0].role === "system" ? 1 : 0);
          const more = el("button", { type: "button", style: "margin-bottom:10px" }, `Show ${hidden} earlier messages`);
          more.addEventListener("click", () => {
            const frag = document.createDocumentFragment();
            for (const m of convo.slice(convo[0].role === "system" ? 1 : 0, start)) frag.append(renderMessage(m));
            more.replaceWith(frag);
          });
          box.append(more);
        }
        for (const m of convo.slice(start)) box.append(renderMessage(m));
        if (d.reply) box.append(renderMessage(d.reply, "reply"));
        if (!box.childElementCount) box.append(el("div", { class: "empty-state" }, "Could not parse this protocol. Check the raw tabs."));
        return box;
      },
      request: () => el("pre", { class: "json" }, JSON.stringify(d.request, null, 2)),
      reply: () => el("pre", { class: "json" }, JSON.stringify(d.response, null, 2)),
    };
    const pane = el("div", {});
    const tabs = el("div", { class: "tabs" });
    const show = (name) => {
      for (const b of tabs.children) b.classList.toggle("on", b.dataset.view === name);
      pane.replaceChildren(views[name]());
    };
    for (const [name, label] of [["conversation", "Conversation"], ["request", "Request JSON"], ["reply", "Reply JSON"]]) {
      tabs.append(el("button", { type: "button", "data-view": name, onclick: () => show(name) }, label));
    }
    tabs.append(el("button", { type: "button", onclick: () => navigator.clipboard?.writeText(JSON.stringify(d.request)) }, "Copy request"));
    detail.replaceChildren(meta, tabs, pane);
    show("conversation");
    detail.scrollTop = 0;
  }

  form.addEventListener("submit", (e) => { e.preventDefault(); refresh(); });
  form.addEventListener("change", (e) => { if (e.target.tagName === "SELECT" || e.target.type === "checkbox") refresh(); });
  list.addEventListener("scroll", () => {
    if (next && !loading && list.scrollTop + list.clientHeight > list.scrollHeight - 200) loadPage(false);
  });
  const setTop = () => document.documentElement.style.setProperty("--top", (document.querySelector("header").offsetHeight + form.offsetHeight) + "px");
  window.addEventListener("resize", setTop);
  setTop();
  loadHash();
  if (!key) askKey(); else refresh();
})();
</script>
</body>
</html>
